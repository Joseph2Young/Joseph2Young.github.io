<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>因子动量多策略看板</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fed">
<style>
  :root{
    /* 独立站点主题: 浅色默认; 红涨蓝跌 */
    --up: #d5495c;
    --down: #2f6fed;
    --c-text: #1a1a1a;
    --c-text2: #555;
    --c-text3: #888;
    --c-text4: #aaa;
    --c-muted: rgba(0,0,0,.045);
    --hairline: rgba(0,0,0,.09);
    --c-bg: #ffffff;
    --s2: #3ba272;
    --s3: #8a5cd6;
    --s4: #aaa;
  }
  html[data-theme="dark"]{
    --up: #e06c75;
    --down: #5b93ff;
    --c-text: #e8e8ea;
    --c-text2: #b0b0b4;
    --c-text3: #8a8a90;
    --c-text4: #5f5f66;
    --c-muted: rgba(255,255,255,.06);
    --hairline: rgba(255,255,255,.11);
    --c-bg: #17181a;
    --s2: #4fbd8d;
    --s3: #a37ee8;
    --s4: #5f5f66;
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]):not([data-theme="dark"]){
      --up: #e06c75;
      --down: #5b93ff;
      --c-text: #e8e8ea;
      --c-text2: #b0b0b4;
      --c-text3: #8a8a90;
      --c-text4: #5f5f66;
      --c-muted: rgba(255,255,255,.06);
      --hairline: rgba(255,255,255,.11);
      --c-bg: #17181a;
      --s2: #4fbd8d;
      --s3: #a37ee8;
      --s4: #5f5f66;
    }
  }
  html,body{margin:0;padding:0;background:var(--c-bg);}
  .root{
    font-family:-apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    padding:16px 16px 12px;
    color:var(--c-text);
    width:100%;max-width:760px;box-sizing:border-box;
    margin:0 auto;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  .up{color:var(--up);}
  .down{color:var(--down);}
  .flat{color:var(--c-text3);}

  /* ---------- 头部 ---------- */
  .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .head .t{font-size:16px;font-weight:500;line-height:22px;letter-spacing:0;}
  .head .meta{font-size:11px;color:var(--c-text3);line-height:16px;}
  .head .sp{flex:1;}
  .linkbtn{font-size:11px;color:var(--c-text2);padding:2px 8px;border-radius:6px;line-height:16px;}
  .linkbtn:hover{background:var(--c-muted);}
  .linkbtn[aria-pressed="true"]{color:var(--c-text);background:var(--c-muted);}
  .linkbtn.err{color:var(--c-down);}

  /* ---------- 展开面板 ---------- */
  .panel{display:none;border-block-start:1px solid var(--hairline);margin-block-start:8px;padding-block-start:8px;}
  .panel.open{display:block;}
  .panel h4{margin:0 0 4px;font-size:12px;font-weight:500;line-height:17px;}
  .panel ul{margin:0 0 4px;padding-inline-start:15px;}
  .panel li{font-size:11px;color:var(--c-text2);line-height:18px;}
  .panel p{font-size:11px;color:var(--c-text2);line-height:18px;margin:0 0 4px;}

  /* ---------- KPI 首屏 ---------- */
  .kpi{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;margin-block-start:6px;}
  .kpi .cell{padding-inline:10px;min-width:0;}
  .kpi .cell + .cell{border-inline-start:1px solid var(--hairline);}
  .kpi .cell:first-child{padding-inline-start:0;}
  .kpi .lab{font-size:10px;color:var(--c-text3);line-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .val{font-size:17px;font-weight:500;line-height:21px;white-space:nowrap;}
  .kpi .sub{font-size:10px;color:var(--c-text2);line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- 页签 ---------- */
  .tabs{display:flex;gap:2px;margin-block-start:10px;border-block-end:1px solid var(--hairline);}
  .tab{font-size:12px;line-height:18px;padding:4px 10px;color:var(--c-text2);border-block-end:2px solid transparent;margin-block-end:-1px;}
  .tab:hover{color:var(--c-text);}
  .tab[aria-selected="true"]{color:var(--c-text);border-block-end-color:var(--c-text);font-weight:500;}

  /* ---------- 资产地图(热力条带) ---------- */
  .mapwrap{margin-block-start:8px;}
  .band{margin-block-start:6px;}
  .band:first-child{margin-block-start:0;}
  .bandhead{display:flex;align-items:baseline;gap:8px;height:16px;}
  .bandhead .bn{font-size:11px;font-weight:500;color:var(--c-text);line-height:16px;white-space:nowrap;}
  .bandhead .bm{font-size:10px;color:var(--c-text3);line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bandbody{display:flex;gap:2px;border-radius:4px;overflow:hidden;}
  .tile{border-radius:4px;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;box-sizing:border-box;}
  .tile .nm{font-size:11px;line-height:14px;color:var(--c-text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tile .sb{font-size:9px;line-height:12px;color:var(--c-text3);max-width:100%;overflow:hidden;white-space:nowrap;}
  .code{font-size:9px;color:var(--c-text3);line-height:12px;}
  .tile .pc{font-size:12px;font-weight:500;line-height:15px;white-space:nowrap;}
  /* 单标的横排(核心资产条带): 权重占比小导致条带高度低, 纵排三行会溢出 */
  .tile.t-row{flex-direction:row;gap:10px;align-items:baseline;justify-content:center;padding:2px 10px;}
  .tile.t-row .nm{flex:0 1 auto;}
  .t-up{background:color-mix(in srgb, var(--up) 13%, var(--c-muted));}
  .t-down{background:color-mix(in srgb, var(--down) 12%, var(--c-muted));}
  .t-flat{background:var(--c-muted);}
  .t-core{background:color-mix(in srgb, var(--s3) 14%, var(--c-muted));}
  /* 窄屏(手机): 条带改等宽网格(每行5格), 免横滑, 各组格子大小一致 */
  @media (max-width:560px){
    /* 高度改自适应: 桌面固定像素高度代表配置权重, 手机端已是等宽网格, 固定高度会裁切/溢出内容 */
    .bandbody{flex-wrap:wrap;overflow:visible;height:auto !important;}
    /* grow=0: 单标的(如核心资产)不再拉伸通栏, 与五列网格保持一致宽度 */
    .tile{flex:0 1 calc(20% - 2px);min-width:0;}
    .tile .sb{display:block;font-size:8px;}
    .tile .nm{font-size:10px;}
    .tile .pc{font-size:10px;}
  }
  .legend{display:flex;gap:14px;font-size:10px;color:var(--c-text3);margin-block-start:6px;line-height:14px;flex-wrap:wrap;}
  .lg-brief{display:none;}

  /* ---------- 持仓明细 ---------- */
  .detail{display:grid;grid-template-columns:1.15fr 1.15fr 1fr;gap:16px;margin-block-start:8px;}
  .detail h4{margin:0 0 3px;font-size:11px;font-weight:500;line-height:16px;color:var(--c-text2);}
  .detail h4 .rt{float:right;font-weight:400;}
  .dtable{width:100%;border-collapse:collapse;font-size:11px;line-height:18px;}
  .dtable th{font-weight:400;color:var(--c-text3);text-align:right;padding:1px 3px;white-space:nowrap;}
  .dtable th:first-child,.dtable td:first-child{text-align:left;}
  .dtable td{padding:1px 3px;text-align:right;white-space:nowrap;color:var(--c-text);}
  .signal{font-size:11px;line-height:17px;margin-block-start:4px;color:var(--c-text2);}
  .signal b{font-weight:500;color:var(--c-text);}
  .trk{font-size:11px;line-height:16px;color:var(--c-text2);margin-block-start:5px;font-weight:500;}
  .livemark{font-size:9px;font-weight:400;color:var(--c-text3);border:1px solid var(--hairline);border-radius:3px;padding:0 3px;}
  .dtable tr.pick td{color:var(--c-text);}

  /* ---------- 走势 ---------- */
  .chart-legend{display:flex;gap:4px;flex-wrap:wrap;margin-block-start:8px;}
  .lgchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:18px;padding:2px 8px;border-radius:6px;color:var(--c-text2);}
  .lgchip:hover{background:var(--c-muted);}
  .lgchip .dot{width:7px;height:7px;border-radius:50%;}
  .lgchip[aria-pressed="false"]{opacity:.35;}
  .axis{font-size:9px;fill:var(--c-text4);}
  .gridl{stroke:var(--hairline);stroke-width:.5;}
  .ln{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;}
  .s1{stroke:var(--up);} .s2{stroke:var(--s2);} .s3{stroke:var(--s3);} .s4{stroke:var(--s4);}
  .d1{fill:var(--up);} .d2{fill:var(--s2);} .d3{fill:var(--s3);} .d4{fill:var(--s4);}
  .ln.dash{stroke-dasharray:3 3;stroke-width:1;}
  .ln.sd{stroke:var(--down);}
  .dd{fill:var(--down);}

  /* ---------- 微盘择时 ---------- */
  .mc-status{display:flex;align-items:baseline;gap:8px;margin-block-start:8px;flex-wrap:wrap;}
  .mc-quad{font-size:12px;font-weight:500;line-height:17px;padding:1px 9px;border-radius:9px;}
  .mc-quad.q-hot{background:color-mix(in srgb, var(--up) 16%, transparent);color:var(--up);}
  .mc-quad.q-cold{background:color-mix(in srgb, var(--down) 15%, transparent);color:var(--down);}
  .mc-quad.q-mid{background:var(--c-muted);color:var(--c-text2);}
  .mc-quad.q-na{background:var(--c-muted);color:var(--c-text3);}
  .mc-note{font-size:11px;color:var(--c-text3);line-height:17px;}
  .mc-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-block-start:8px;}
  .mc-stats .cell{min-width:0;}
  .mc-stats .cell + .cell{border-inline-start:1px solid var(--hairline);padding-inline-start:10px;}
  .mc-stats .lab{font-size:10px;color:var(--c-text3);line-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mc-stats .val{font-size:17px;font-weight:500;line-height:21px;white-space:nowrap;}
  .mc-stats .sub{font-size:10px;color:var(--c-text2);line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mc-legend{display:flex;gap:10px;font-size:10px;color:var(--c-text3);line-height:14px;margin-block-start:2px;}
  .mc-th{font-size:10px;color:var(--c-text4);line-height:14px;}
  h4.mc-h{margin:10px 0 3px;font-size:12px;font-weight:500;line-height:17px;}

  /* ---------- 动量条 ---------- */
  .mom{border-block-start:1px solid var(--hairline);margin-block-start:10px;padding-block-start:6px;}
  .mom .mh{display:flex;align-items:baseline;gap:8px;}
  .mom .mt{font-size:12px;font-weight:500;line-height:17px;}
  .mom .hint{font-size:10px;color:var(--c-text4);}

  /* 动量热力色块图(按列): 每列一个周期, 列内色块按得分降序, 色块深浅=|得分|相对强度 */
  .momgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-block-start:4px;}
  .mg-col{display:grid;gap:3px;grid-template-rows:16px repeat(3,40px);}
  .mg-cell{border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;}
  .mg-head{height:16px;line-height:16px;font-size:10px;font-weight:400;color:var(--c-text3);}
  .mg-name{font-size:10px;line-height:13px;color:var(--c-text2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px;}
  .mg-val{font-size:12px;font-weight:500;line-height:15px;}
  .mg-none{color:var(--c-text4);background:var(--c-muted);}
  .mg-rank{position:absolute;top:1px;left:4px;font-size:8px;line-height:10px;color:var(--c-text3);font-weight:400;}

  /* 仓位占比(4×25%轮动: 每个动量周期排名第一的子策略获得一份25%仓位) */
  .alloc{margin-block-start:6px;display:grid;gap:3px;}
  .alloc-title{font-size:10px;line-height:14px;color:var(--c-text3);}
  .alloc-row{display:grid;grid-template-columns:60px 1fr 38px;align-items:center;gap:8px;}
  .alloc-lab{font-size:11px;line-height:15px;color:var(--c-text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .alloc-bar{display:flex;gap:2px;height:10px;}
  .alloc-seg{flex:1;border-radius:2px;background:var(--c-muted);}
  .alloc-seg.on.a1{background:var(--up);} .alloc-seg.on.a2{background:var(--s2);} .alloc-seg.on.a3{background:var(--s3);}
  .alloc-pct{font-size:11px;line-height:15px;text-align:end;color:var(--c-text);}
</style>
<style>
/* 响应式适配: 由 build.py 在构建时注入 <head> 尾部(置于模板样式之后, 覆盖生效)
   断点设计: ≤640px 手机 / 641-760px 窄桌面与平板竖屏 / >760px 桌面(模板原样) */

/* ===== 全宽度通用: 防止 grid 子项内容溢出撑破布局 ===== */
.detail>div,
.mom #mom-body{min-width:0;}

/* ===== 窄桌面/平板竖屏(≤760px): 表格防溢出, 内容过宽时内部横滑 ===== */
@media (max-width:760px){
  .detail>div{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .mom #mom-body{overflow-x:auto;-webkit-overflow-scrolling:touch;}
}

/* ===== 手机(≤640px) ===== */
@media (max-width:640px){
  /* 刘海屏/圆角屏安全区(配合 viewport-fit=cover 生效) */
  .root{
    padding:12px 12px 10px;
    padding-left:max(12px, env(safe-area-inset-left));
    padding-right:max(12px, env(safe-area-inset-right));
  }

  /* 头部: 更紧凑, 按钮加大触控面积 */
  .head{gap:4px;row-gap:6px;}
  .head .t{font-size:15px;}
  .linkbtn{font-size:12px;padding:4px 10px;}

  /* KPI 首屏: 4列 -> 2×2 网格, 避免挤压截断 */
  .kpi{grid-template-columns:1fr 1fr;}
  .kpi .cell{padding-inline:8px;padding-block:2px;}
  .kpi .cell:nth-child(3){border-inline-start:none;padding-inline-start:0;}
  .kpi .cell:nth-child(n+3){border-block-start:1px solid var(--hairline);}
  .kpi .val{font-size:15px;line-height:18px;}
  .kpi .sub{font-size:9px;}

  /* 页签: 加大触控面积 */
  .tab{font-size:13px;padding:7px 12px;}

  /* 资产地图: 等宽网格(每行5格), 免横滑, 各组格子大小一致; 条带高度改自适应(桌面固定像素代表配置权重, 手机端会溢出重叠) */
  .bandbody{flex-wrap:wrap;overflow:visible;gap:2px;height:auto !important;}
  /* grow=0: 单标的(如核心资产)不再拉伸通栏, 与五列网格保持一致宽度 */
  .tile{flex:0 1 calc(20% - 2px);min-width:0;padding:4px 2px;}
  .tile .sb{font-size:8px;}
  .tile .nm{font-size:11px;}
  .tile .pc{font-size:11px;}
  .legend{gap:10px;}
  .lg-full{display:none;}
  .lg-brief{display:inline;}

  /* 持仓明细: 三栏堆叠为单栏, 各表格内部可横滑 */
  .detail{grid-template-columns:1fr;gap:16px;}
  .detail>div{padding-block-end:2px;}
  .dtable{min-width:300px;}

  /* 动量表: 自适应宽度(4档短窗口, 无需横滑); 标题与说明文字纵向堆叠(父级仍是 flex, 需先改为 block) */
  .mom table{min-width:0;}
  .mom .mh{display:block;}
  .mom .hint{display:block;margin-block-start:2px;}

  /* 展开面板: 行高略加大便于触屏阅读 */
  .panel li,.panel p{line-height:19px;}
}
</style>
</head>
<body>
<div class="root" id="app">
  <div class="head">
    <span class="t">因子动量多策略</span>
    <span class="meta" id="hd-meta"></span>
    <span class="sp"></span>
    <button class="linkbtn" id="btn-quote" title="刷新当前涨跌幅">刷新行情</button>
    <button class="linkbtn" id="btn-theme" title="切换浅色/深色主题">主题</button>
  </div>

  <div class="kpi" id="kpi"></div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="map" aria-selected="true">资产地图</button>
    <button class="tab" role="tab" data-tab="detail" aria-selected="false">持仓明细</button>
    <button class="tab" role="tab" data-tab="trend" aria-selected="false">辅助走势</button>
    <button class="tab" role="tab" data-tab="microcap" aria-selected="false">微盘择时</button>
  </div>

  <div id="view-map"><div class="mapwrap" id="map"></div><div class="legend" id="map-legend"></div></div>
  <div id="view-detail" style="display:none"></div>
  <div id="view-trend" style="display:none">
    <div class="chart-legend" id="chart-legend"></div>
    <div id="chart" style="margin-block-start:4px"></div>
  </div>
  <div id="view-microcap" style="display:none"></div>

  <div class="mom">
    <div class="mh"><span class="mt">子策略多周期动量与仓位</span><span class="hint">年化收益 × R²（对数回归），5/10/15/20 日；色块深浅=得分强度，角标=周期内排名；每周期排名第一获得一份 25% 仓位</span></div>
    <div id="mom-body"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var host = window.DaimonWidget;
var fetchedData=null;
function fb(){ try{ return JSON.parse(document.getElementById('fallback-data').textContent); }catch(e){ return {}; } }
function curData(){
  if(fetchedData && fetchedData.b1 && fetchedData.portfolio) return fetchedData;
  var m = (host && host.data && host.data.main) || null;
  return (m && m.b1 && m.portfolio) ? m : fb();
}
/* 独立站点: 启动时后台拉取最新 dashboard_data.json, 成功后整体重渲染 */
function loadRemoteData(){
  fetch('dashboard_data.json?_='+Date.now(),{cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error('http '+r.status);
    return r.json();
  }).then(function(j){
    if(j && j.b1 && j.portfolio){
      fetchedData=j;
      render(ensureView());
      var el=$('hd-meta'); if(el) el.title='已加载最新数据';
      /* 新数据到达后补刷一次盘中行情: 打开页面时的首次刷新可能早于本文件到达，避免行情被旧快照覆盖 */
      if(inSession()) refreshQuotes(false);
    }
  }).catch(function(){});
}
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function code6(c){ return String(c==null?'':c).slice(0,6); }
function nameCode(nm, code){ return esc(nm)+' <span class="code num">'+code6(code)+'</span>'; }
function fp(v,d){ if(v==null||isNaN(v)) return '—'; return Number(v).toFixed(d==null?2:d); }
function pct(v){ if(v==null||isNaN(v)) return '—'; return (v>0?'+':'')+fp(v,2)+'%'; }
function cls(v){ return v==null?'flat':(v>0?'up':(v<0?'down':'flat')); }
function pctHtml(v){ return '<span class="'+cls(v)+' num">'+pct(v)+'</span>'; }
function scoreCls(v){ return v==null?'flat':(v>0?'up':(v<0?'down':'flat')); }
var STRATS=['质量微盘','红利成长','核心资产'];
var state={tab:'map', legend:{'质量微盘':true,'红利成长':true,'核心资产':true,'沪深300':false}};

/* ---------------- 盘中行情刷新(仅页面打开时运行; 15分钟定时+手动按钮) ----------------
   数据源: 腾讯行情公开接口(qt.gtimg.cn, 允许跨域); 仅刷新 close/pct_chg, 持仓名单不变 */
var view=null, viewSrc=null;
function ensureView(){
  var m=curData();
  if(view===null || viewSrc!==m){ view=JSON.parse(JSON.stringify(m)); viewSrc=m; }
  return view;
}
function tencentSymbol(code){ return (String(code).charAt(0)==='6'||String(code).charAt(0)==='9'?'sh':'sz')+String(code); }
function inSession(){
  var n=new Date(), d=n.getDay(), t=n.getHours()*60+n.getMinutes();
  if(d===0||d===6) return false;
  return (t>=565&&t<695)||(t>=775&&t<905); /* 9:25-11:35, 12:55-15:05 */
}
function setQuoteStatus(txt, isErr){
  var el=$('btn-quote'); if(!el) return;
  el.textContent=txt||'刷新行情';
  el.className='linkbtn'+(isErr?' err':'');
}
function refreshQuotes(manual){
  var d=ensureView();
  if(!d || !d.b1) return;
  var codes=[], seen={};
  function pick(list){ (list||[]).forEach(function(x){ if(x&&x.code&&!seen[x.code]){ seen[x.code]=1; codes.push(String(x.code)); } }); }
  pick(d.b1.holdings); pick(d.dividend&&d.dividend.holdings);
  pick(d.etf&&d.etf.targets); pick(d.etf&&d.etf.pool);
  if(!codes.length) return;
  if(manual) setQuoteStatus('刷新中…');
  var url='https://qt.gtimg.cn/q=' + codes.map(tencentSymbol).join(',') + '&_=' + Date.now();
  fetch(url).then(function(r){ return r.text(); }).then(function(txt){
    var map={};
    var re=/v_(?:sh|sz)(\d{6})="([^"]*)"/g, m2;
    while((m2=re.exec(txt))){
      var f=m2[2].split('~');
      var close=Number(f[3]), pct=Number(f[32]);
      if(isFinite(close)&&isFinite(pct)) map[m2[1]]={close:close, pct:pct};
    }
    function upd(list){ (list||[]).forEach(function(x){
      var q=map[String(x.code)];
      if(q){ x.close=q.close; x.pct_chg=q.pct; }
    }); }
    upd(d.b1.holdings); upd(d.dividend&&d.dividend.holdings);
    upd(d.etf&&d.etf.targets); upd(d.etf&&d.etf.pool);
    recomputeCoreLive(d);
    render(d);
    var n=new Date(), hh=('0'+n.getHours()).slice(-2), mm=('0'+n.getMinutes()).slice(-2);
    setQuoteStatus('已刷新 '+hh+':'+mm);
  }).catch(function(){
    setQuoteStatus('刷新失败，保留上次数据', true);
  });
}
setInterval(function(){ if(inSession()) refreshQuotes(false); }, 15*60*1000);
if(inSession()) refreshQuotes(false);
if($('btn-quote')) $('btn-quote').addEventListener('click', function(){ refreshQuotes(true); });

/* ---------------- 渲染 ---------------- */
function render(d){
  if(!d || !d.b1) return;
  var meta=d.meta||{};
  $('hd-meta').textContent='行情 '+ (meta.quote_date||'—') +' · 选股基准 '+(meta.selection_date||'—') + (meta.generated_at?(' · 更新于 '+meta.generated_at.slice(5,16)):'');
  renderKpi(d);
  renderMap(d);
  renderDetail(d);
  renderChart(d);
  renderMomentum(d);
  renderMicrocap(d);
}

function avgPct(list){
  var s=0,n=0;
  (list||[]).forEach(function(x){ if(x&&isFinite(x.pct_chg)){ s+=x.pct_chg; n++; } });
  return n? s/n : null;
}

function fmtScore(v){ if(v==null||isNaN(v)) return '—'; if(Math.abs(v)<0.005) return '0.00'; return (v>0?'+':'')+Number(v).toFixed(2); }

/* 对数回归动量(与 fetch_data.momentum_detail 同口径): 年化=exp(slope)^250-1, 得分=年化×R² */
function momentumCalc(closes){
  var ys=[], i;
  for(i=0;i<closes.length;i++){ var c=closes[i]; if(!isFinite(c)||c<=0) return null; ys.push(Math.log(c)); }
  var n=ys.length; if(n<2) return null;
  var sx=0,sy=0,sxy=0,sxx=0;
  for(i=0;i<n;i++){ sx+=i; sy+=ys[i]; sxy+=i*ys[i]; sxx+=i*i; }
  var slope=(n*sxy-sx*sy)/(n*sxx-sx*sx);
  var intercept=(sy-slope*sx)/n, ssRes=0, ssTot=0, mean=sy/n;
  for(i=0;i<n;i++){ var f=slope*i+intercept; ssRes+=(ys[i]-f)*(ys[i]-f); ssTot+=(ys[i]-mean)*(ys[i]-mean); }
  var r2=ssTot>0?1-ssRes/ssTot:0;
  var annualized=Math.pow(Math.exp(slope),250)-1;
  return {annualized:annualized, r2:r2, score:annualized*r2};
}
/* 盘中: 用实时价作为25日动量窗口末点重算得分与排名(对齐聚宽24日线+盘中分钟线) */
function recomputeCoreLive(d){
  var etf=d.etf; if(!etf) return;
  var tr=etf.tracks&&etf.tracks['25日动量'], mc=etf.mom_closes;
  if(!tr||!mc||!tr.detail) return;
  var pool={}; (etf.pool||[]).forEach(function(x){ pool[String(x.code)]=x; });
  var best=null, bs=-Infinity;
  Object.keys(tr.detail).forEach(function(code){
    var base=mc[code], q=pool[code];
    if(!base||base.length<2||!q||!isFinite(q.close)) return;
    var m=momentumCalc(base.concat([q.close]));
    if(!m) return;
    var dd=tr.detail[code];
    dd.annualized=m.annualized; dd.r2=m.r2; dd.score=m.score; dd.pass=false;
    if(m.score>bs){ bs=m.score; best=code; }
  });
  if(best){
    tr.detail[best].pass=true;
    if(best==='510300'){ tr.pick=null; tr.pick_name=null; tr.note='沪深300居首(空仓信号)·盘中'; }
    else { tr.pick=best; tr.pick_name=tr.detail[best].name; tr.note=(tr.live?'':'')||null; }
  }
  tr.live=true;
}

function drawChart(series){
  var box=$('chart'); if(!box) return;
  var W=box.clientWidth||660, H=238, PL=34, PR=8, PT=8, PB=16;
  var on=series.filter(function(s){return state.legend[s.name]&&s.nav&&s.nav.length>1;});
  if(!on.length){ box.innerHTML='<svg width="'+W+'" height="'+H+'"></svg>'; return; }
  var allNav=[];
  on.forEach(function(s){ allNav=allNav.concat(s.nav); });
  var ymin=Math.floor(Math.min.apply(null,allNav)), ymax=Math.ceil(Math.max.apply(null,allNav));
  if(ymax-ymin<6){ var mid=(ymax+ymin)/2; ymin=mid-3; ymax=mid+3; }
  var dateKeys={};
  on.forEach(function(s){ (s.dates||[]).forEach(function(dt){ dateKeys[dt]=1; }); });
  dateKeys=Object.keys(dateKeys).sort();
  var x0=dateKeys[0], x1=dateKeys[dateKeys.length-1];
  function dateIndex(ds){ return new Date(ds).getTime(); }
  var span=Math.max(dateIndex(x1)-dateIndex(x0),1);
  function X(ds){ return PL+(dateIndex(ds)-dateIndex(x0))/span*(W-PL-PR); }
  function Y(v){ return PT+(ymax-v)/(ymax-ymin)*(H-PT-PB); }
  var step=Math.max(Math.ceil((ymax-ymin)/4),1);
  var grid='', xlab='';
  for(var g=ymin;g<=ymax;g+=step){
    grid+='<line class="gridl" x1="'+PL+'" y1="'+Y(g)+'" x2="'+(W-PR)+'" y2="'+Y(g)+'"/>'
      +'<text class="axis" x="'+(PL-4)+'" y="'+(Y(g)+3)+'" text-anchor="end">'+g+'</text>';
  }
  var ticks=[[x0,'start'],[dateKeys[Math.floor(dateKeys.length/2)],'middle'],[x1,'end']];
  var xlab='';
  ticks.forEach(function(tk){
    var dt=tk[0]; if(!dt) return;
    xlab+='<text class="axis" x="'+X(dt)+'" y="'+(H-4)+'" text-anchor="'+tk[1]+'">'+dt.slice(0,7)+'</text>';
  });
  var paths='', dots='';
  on.forEach(function(s){
    var pts=s.nav.map(function(v,i){ var dt=(s.dates[i]||x0); return X(dt).toFixed(1)+','+Y(v).toFixed(1); });
    paths+='<polyline class="ln '+s.cls+'" points="'+pts.join(' ')+'"/>';
    var lv=s.nav[s.nav.length-1];
    dots+='<circle class="'+s.dot+'" cx="'+X(s.dates[s.dates.length-1]||x1)+'" cy="'+Y(lv)+'" r="2.5"/>';
  });
  box.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+grid+xlab+paths+dots+'</svg>';
}

  var box=$('mc-chart'); if(!box) return;
  if(!trend || trend.length<2){ box.innerHTML=''; return; }
  var W=box.clientWidth||660, H=170, PL=26, PR=8, PT=8, PB=16;
  function X(i){ return PL+i/(trend.length-1)*(W-PL-PR); }
  function Y(v){ return PT+(100-v)/100*(H-PT-PB); }
  var grid='', xlab='';
  [0,20,40,60,80,100].forEach(function(g){
    grid+='<line class="gridl" x1="'+PL+'" y1="'+Y(g)+'" x2="'+(W-PR)+'" y2="'+Y(g)+'"/>'
      +'<text class="axis" x="'+(PL-4)+'" y="'+(Y(g)+3)+'" text-anchor="end">'+g+'</text>';
  });
  [40,60].forEach(function(g){
    grid+='<line class="gridl" x1="'+PL+'" y1="'+Y(g)+'" x2="'+(W-PR)+'" y2="'+Y(g)+'" style="stroke:var(--c-text4);stroke-dasharray:3 3"/>';
  });
  xlab+='<text class="axis" x="'+PL+'" y="'+(H-4)+'" text-anchor="start">'+trend[0].date.slice(0,7)+'</text>'
    +'<text class="axis" x="'+(W-PR)+'" y="'+(H-4)+'" text-anchor="end">'+trend[trend.length-1].date.slice(0,7)+'</text>';
  function line(key, cls){
    var pts=[];
    trend.forEach(function(r,i){ if(r[key]!=null) pts.push(X(i).toFixed(1)+','+Y(r[key]).toFixed(1)); });
    return pts.length>1?'<polyline class="ln '+cls+'" points="'+pts.join(' ')+'"/>':'';
  }
  var dots='';
  ['amt_pct','senti_pct'].forEach(function(key, k){
    for(var i=trend.length-1;i>=0;i--){
      var v=trend[i][key]; if(v==null) continue;
      dots+='<circle class="'+(k===0?'d1':'dd')+'" cx="'+X(i)+'" cy="'+Y(v)+'" r="2.5"/>';
      break;
    }
  });
  box.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+grid+xlab
    +line('amt_pct','s1')+line('senti_pct','sd')+dots+'</svg>';
}

/* ---------------- 交互 ---------------- */
function bind(){
  var tabs=$('tabs'); if(!tabs) return;
  tabs.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.tab'); if(!b) return;
    state.tab=b.getAttribute('data-tab');
    Array.prototype.forEach.call(tabs.querySelectorAll('.tab'),function(t){
      t.setAttribute('aria-selected',t===b?'true':'false');
    });
    $('view-map').style.display=state.tab==='map'?'':'none';
    $('view-detail').style.display=state.tab==='detail'?'':'none';
    $('view-trend').style.display=state.tab==='trend'?'':'none';
    $('view-microcap').style.display=state.tab==='microcap'?'':'none';
    if(state.tab==='trend'){ renderChart(ensureView()); }
    if(state.tab==='microcap'){ renderMicrocap(ensureView()); }
  });
}

try{
  /* 主题: localStorage 记忆 > 手动切换 > 跟随系统 */
  (function(){
    var saved=null;
    try{ saved=localStorage.getItem('dash-theme'); }catch(e){}
    if(saved==='light'||saved==='dark') document.documentElement.setAttribute('data-theme',saved);
    var btn=$('btn-theme');
    if(btn) btn.addEventListener('click',function(){
      var cur=document.documentElement.getAttribute('data-theme');
      var dark = cur ? (cur==='dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var next=dark?'light':'dark';
      document.documentElement.setAttribute('data-theme',next);
      try{ localStorage.setItem('dash-theme',next); }catch(e){}
    });
  })();
  bind();
  render(ensureView());
  loadRemoteData();
  if(host && typeof host.onDataChange==='function'){
    host.onDataChange(function(){ render(ensureView()); });
  }
  if(host && typeof host.onThemeChange==='function'){ host.onThemeChange(function(){ render(ensureView()); }); }
  window.addEventListener('resize',function(){ var d=ensureView(); if(state.tab==='trend')renderChart(d); if(state.tab==='microcap')renderMicrocap(d); });
}catch(e){ /* 渲染异常时保持静态内容 */ }
})();
</script>
</body>
</html>
