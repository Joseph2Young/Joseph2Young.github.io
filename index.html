<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>因子动量多策略看板</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fed">
<style>
  :root{
    /* 独立站点主题: 浅色默认; 红涨蓝跌 */
    --up: #d5495c;
    --down: #2f6fed;
    --c-text: #1a1a1a;
    --c-text2: #555;
    --c-text3: #888;
    --c-text4: #aaa;
    --c-muted: rgba(0,0,0,.045);
    --hairline: rgba(0,0,0,.09);
    --c-bg: #ffffff;
    --s2: #3ba272;
    --s3: #8a5cd6;
    --s4: #aaa;
    --chg: #c47f17;
  }
  html[data-theme="dark"]{
    --up: #e06c75;
    --down: #5b93ff;
    --c-text: #e8e8ea;
    --c-text2: #b0b0b4;
    --c-text3: #8a8a90;
    --c-text4: #5f5f66;
    --c-muted: rgba(255,255,255,.06);
    --hairline: rgba(255,255,255,.11);
    --c-bg: #17181a;
    --s2: #4fbd8d;
    --s3: #a37ee8;
    --s4: #5f5f66;
    --chg: #e6a23c;
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]):not([data-theme="dark"]){
      --up: #e06c75;
      --down: #5b93ff;
      --c-text: #e8e8ea;
      --c-text2: #b0b0b4;
      --c-text3: #8a8a90;
      --c-text4: #5f5f66;
      --c-muted: rgba(255,255,255,.06);
      --hairline: rgba(255,255,255,.11);
      --c-bg: #17181a;
      --s2: #4fbd8d;
      --s3: #a37ee8;
      --s4: #5f5f66;
      --chg: #e6a23c;
    }
  }
  html,body{margin:0;padding:0;background:var(--c-bg);}
  .root{
    font-family:-apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    padding:16px 16px 12px;
    color:var(--c-text);
    width:100%;max-width:760px;box-sizing:border-box;
    margin:0 auto;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  .up{color:var(--up);}
  .down{color:var(--down);}
  .flat{color:var(--c-text3);}

  /* ---------- 头部 ---------- */
  .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .head .t{font-size:16px;font-weight:500;line-height:22px;letter-spacing:0;}
  .head .meta{font-size:11px;color:var(--c-text3);line-height:16px;}
  .head .sp{flex:1;}
  .linkbtn{font-size:11px;color:var(--c-text2);padding:2px 8px;border-radius:6px;line-height:16px;}
  .linkbtn:hover{background:var(--c-muted);}
  .linkbtn[aria-pressed="true"]{color:var(--c-text);background:var(--c-muted);}
  .linkbtn.err{color:var(--c-down);}

  /* ---------- 展开面板 ---------- */
  .panel{display:none;border-block-start:1px solid var(--hairline);margin-block-start:8px;padding-block-start:8px;}
  .panel.open{display:block;}
  .panel h4{margin:0 0 4px;font-size:12px;font-weight:500;line-height:17px;}
  .panel ul{margin:0 0 4px;padding-inline-start:15px;}
  .panel li{font-size:11px;color:var(--c-text2);line-height:18px;}
  .panel p{font-size:11px;color:var(--c-text2);line-height:18px;margin:0 0 4px;}

  /* ---------- KPI 首屏 ---------- */
  .kpi{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;margin-block-start:6px;}
  .kpi .cell{padding-inline:10px;min-width:0;}
  .kpi .cell + .cell{border-inline-start:1px solid var(--hairline);}
  .kpi .cell:first-child{padding-inline-start:0;}
  .kpi .lab{font-size:10px;color:var(--c-text3);line-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .val{font-size:17px;font-weight:500;line-height:21px;white-space:nowrap;}
  .kpi .sub{font-size:10px;color:var(--c-text2);line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- 页签 ---------- */
  .tabs{display:flex;gap:2px;margin-block-start:10px;border-block-end:1px solid var(--hairline);}
  .tab{font-size:12px;line-height:18px;padding:4px 10px;color:var(--c-text2);border-block-end:2px solid transparent;margin-block-end:-1px;}
  .tab:hover{color:var(--c-text);}
  .tab[aria-selected="true"]{color:var(--c-text);border-block-end-color:var(--c-text);font-weight:500;}

  /* ---------- 资产地图(热力条带) ---------- */
  .mapwrap{margin-block-start:8px;}
  .band{margin-block-start:6px;}
  .band:first-child{margin-block-start:0;}
  .bandhead{display:flex;align-items:baseline;gap:8px;height:16px;}
  .bandhead .bn{font-size:11px;font-weight:500;color:var(--c-text);line-height:16px;white-space:nowrap;}
  .bandhead .bm{font-size:10px;color:var(--c-text3);line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bandbody{display:flex;gap:2px;border-radius:4px;overflow:hidden;}
  .tile{border-radius:4px;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;box-sizing:border-box;position:relative;}
  .tile .nm{font-size:11px;line-height:14px;color:var(--c-text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tile .sb{font-size:9px;line-height:12px;color:var(--c-text3);max-width:100%;overflow:hidden;white-space:nowrap;}
  .code{font-size:9px;color:var(--c-text3);line-height:12px;}
  .tile .pc{font-size:12px;font-weight:500;line-height:15px;white-space:nowrap;}
  /* 单标的横排(核心资产条带): 权重占比小导致条带高度低, 纵排三行会溢出 */
  .tile.t-row{flex-direction:row;gap:10px;align-items:baseline;justify-content:center;padding:2px 10px;}
  .tile.t-row .nm{flex:0 1 auto;}
  .t-up{background:color-mix(in srgb, var(--up) 13%, var(--c-muted));}
  .t-down{background:color-mix(in srgb, var(--down) 12%, var(--c-muted));}
  /* 较上日变动: 新进角标 + 带内退出名单 */
  .tile .bdg{position:absolute;top:1px;right:2px;font-size:8px;line-height:1;padding:1px 3px;border-radius:3px;background:var(--chg);color:#fff;z-index:1;}
  .bandchg{font-size:9px;line-height:12px;color:var(--chg);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bandchg b{font-weight:500;}
  .t-flat{background:var(--c-muted);}
  .t-core{background:color-mix(in srgb, var(--s3) 14%, var(--c-muted));}
  /* 窄屏(手机): 条带改等宽网格(每行5格), 免横滑, 各组格子大小一致 */
  @media (max-width:560px){
    /* 高度改自适应: 桌面固定像素高度代表配置权重, 手机端已是等宽网格, 固定高度会裁切/溢出内容 */
    .bandbody{flex-wrap:wrap;overflow:visible;height:auto !important;}
    /* grow=0: 单标的(如核心资产)不再拉伸通栏, 与五列网格保持一致宽度 */
    .tile{flex:0 1 calc(20% - 2px);min-width:0;}
    .tile .sb{display:block;font-size:8px;}
    .tile .nm{font-size:10px;}
    .tile .pc{font-size:10px;}
  }
  .legend{display:flex;gap:14px;font-size:10px;color:var(--c-text3);margin-block-start:6px;line-height:14px;flex-wrap:wrap;}
  .lg-brief{display:none;}

  /* ---------- 持仓明细 ---------- */
  .detail{display:grid;grid-template-columns:1.15fr 1.15fr 1fr;gap:16px;margin-block-start:8px;}
  .detail h4{margin:0 0 3px;font-size:11px;font-weight:500;line-height:16px;color:var(--c-text2);}
  .detail h4 .rt{float:right;font-weight:400;}
  .dtable{width:100%;border-collapse:collapse;font-size:11px;line-height:18px;}
  .dtable th{font-weight:400;color:var(--c-text3);text-align:right;padding:1px 3px;white-space:nowrap;}
  .dtable th:first-child,.dtable td:first-child{text-align:left;}
  .dtable td{padding:1px 3px;text-align:right;white-space:nowrap;color:var(--c-text);}
  .signal{font-size:11px;line-height:17px;margin-block-start:4px;color:var(--c-text2);}
  .signal b{font-weight:500;color:var(--c-text);}
  .trk{font-size:11px;line-height:16px;color:var(--c-text2);margin-block-start:5px;font-weight:500;}
  .livemark{font-size:9px;font-weight:400;color:var(--c-text3);border:1px solid var(--hairline);border-radius:3px;padding:0 3px;}
  .dtable tr.pick td{color:var(--c-text);}

  /* ---------- 走势 ---------- */
  .tr-h{display:flex;align-items:baseline;gap:8px;}
  .tr-t{font-size:12px;font-weight:500;line-height:17px;}
  .tr-s{font-size:10px;color:var(--c-text4);}
  .chart-legend{display:flex;gap:4px;flex-wrap:wrap;margin-block-start:8px;}
  .lgchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:18px;padding:2px 8px;border-radius:6px;color:var(--c-text2);}
  .lgchip:hover{background:var(--c-muted);}
  .lgchip .dot{width:7px;height:7px;border-radius:50%;}
  .lgchip .dot.d1{background:var(--up);} .lgchip .dot.d2{background:var(--s2);}
  .lgchip .dot.d3{background:var(--s3);} .lgchip .dot.d4{background:var(--s4);}
  .lgchip[aria-pressed="false"]{opacity:.35;}
  .axis{font-size:9px;fill:var(--c-text4);}
  .gridl{stroke:var(--hairline);stroke-width:.5;}
  .ln{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;}
  .s1{stroke:var(--up);} .s2{stroke:var(--s2);} .s3{stroke:var(--s3);} .s4{stroke:var(--s4);}
  .d1{fill:var(--up);} .d2{fill:var(--s2);} .d3{fill:var(--s3);} .d4{fill:var(--s4);}
  .ln.dash{stroke-dasharray:3 3;stroke-width:1;}
  .clipmark{fill:none;stroke:var(--c-text4);stroke-width:.8;opacity:.55;}
  .ln.sd{stroke:var(--down);}
  .dd{fill:var(--down);}

  /* ---------- 微盘择时 ---------- */
  .mc-status{display:flex;align-items:baseline;gap:8px;margin-block-start:8px;flex-wrap:wrap;}
  .mc-quad{font-size:12px;font-weight:500;line-height:17px;padding:1px 9px;border-radius:9px;}
  .mc-quad.q-hot{background:color-mix(in srgb, var(--up) 16%, transparent);color:var(--up);}
  .mc-quad.q-cold{background:color-mix(in srgb, var(--down) 15%, transparent);color:var(--down);}
  .mc-quad.q-mid{background:var(--c-muted);color:var(--c-text2);}
  .mc-quad.q-na{background:var(--c-muted);color:var(--c-text3);}
  .mc-note{font-size:11px;color:var(--c-text3);line-height:17px;}
  .mc-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-block-start:8px;}
  .mc-stats .cell{min-width:0;}
  .mc-stats .cell + .cell{border-inline-start:1px solid var(--hairline);padding-inline-start:10px;}
  .mc-stats .lab{font-size:10px;color:var(--c-text3);line-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mc-stats .val{font-size:17px;font-weight:500;line-height:21px;white-space:nowrap;}
  .mc-stats .sub{font-size:10px;color:var(--c-text2);line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mc-legend{display:flex;gap:10px;font-size:10px;color:var(--c-text3);line-height:14px;margin-block-start:2px;}
  .mc-th{font-size:10px;color:var(--c-text4);line-height:14px;}
  h4.mc-h{margin:10px 0 3px;font-size:12px;font-weight:500;line-height:17px;}

  /* ---------- 动量条 ---------- */
  .mom{border-block-start:1px solid var(--hairline);margin-block-start:10px;padding-block-start:6px;}
  .mom .mh{display:flex;align-items:baseline;gap:8px;}
  .mom .mt{font-size:12px;font-weight:500;line-height:17px;}
  .mom .hint{font-size:10px;color:var(--c-text4);}

  /* 动量热力色块图(按列): 每列一个周期, 列内色块按得分降序, 色块深浅=|得分|相对强度 */
  .momgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin-block-start:4px;}
  .mg-col{display:grid;gap:3px;grid-template-rows:16px 32px repeat(3,40px);min-width:0;}
  .mg-cell{border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;min-width:0;overflow:hidden;}
  .mg-head{height:16px;line-height:16px;font-size:10px;font-weight:400;color:var(--c-text3);}
  .mg-name{font-size:10px;line-height:13px;color:var(--c-text2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px;}
  .mg-val{font-size:12px;font-weight:500;line-height:15px;}
  .mg-none{color:var(--c-text4);background:var(--c-muted);}
  .mg-slot{gap:1px;padding-inline:2px;font-size:9px;line-height:12px;color:var(--c-text2);background:var(--c-muted);box-sizing:border-box;}
  .mg-slot span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mg-owner{font-weight:500;color:var(--c-text);}
  .mg-challenger{font-size:8px;color:var(--c-text3);}
  .mg-rank{position:absolute;top:1px;left:4px;font-size:8px;line-height:10px;color:var(--c-text3);font-weight:400;}

  /* 仓位占比(4×20%轮动: 每个动量周期排名第一的子策略获得一份20%仓位, 四槽共80%) */
  .alloc{margin-block-start:6px;display:grid;gap:3px;}
  .alloc-title{font-size:10px;line-height:14px;color:var(--c-text3);}
  .alloc-note{font-size:10px;line-height:14px;color:var(--c-text3);overflow-wrap:anywhere;}
  .alloc-row{display:grid;grid-template-columns:60px 1fr 38px;align-items:center;gap:8px;}
  .alloc-lab{font-size:11px;line-height:15px;color:var(--c-text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .alloc-bar{display:flex;gap:2px;height:10px;}
  .alloc-seg{flex:1;border-radius:2px;background:var(--c-muted);}
  .alloc-seg.on.a1{background:var(--up);} .alloc-seg.on.a2{background:var(--s2);} .alloc-seg.on.a3{background:var(--s3);}
  .alloc-pct{font-size:11px;line-height:15px;text-align:end;color:var(--c-text);}

  /* ---------- 微立体卡片: 仅在悬停/按压时变换, 无持续渲染 ---------- */
  .bandbody,.momgrid{perspective:760px;}
  .tile,.mg-cell:not(.mg-head){
    --rx:0deg;--ry:0deg;--lift:0px;
    transform:perspective(760px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift));
    transform-style:preserve-3d;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.07),0 2px 2px rgba(0,0,0,.07);
    transition:transform 150ms ease,box-shadow 150ms ease,filter 150ms ease;
  }
  button.tile{border:0;font:inherit;text-align:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  button.tile:focus-visible,.security-link:focus-visible{outline:2px solid var(--c-text2);outline-offset:2px;}
  .tile.is-tilting,.mg-cell.is-tilting{--lift:-1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.48),inset 0 -2px 0 rgba(0,0,0,.06),0 4px 7px rgba(0,0,0,.11);}
  .tile:active,.mg-cell:active{--lift:1px;box-shadow:inset 0 2px 3px rgba(0,0,0,.10),0 1px 1px rgba(0,0,0,.05);}
  html[data-theme="dark"] .tile,html[data-theme="dark"] .mg-cell:not(.mg-head){box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 0 rgba(0,0,0,.24),0 2px 2px rgba(0,0,0,.20);}

  /* ---------- 标的信息弹层 ---------- */
  .security-popover{position:fixed;z-index:30;width:min(312px,calc(100vw - 24px));box-sizing:border-box;padding:12px 14px 13px;border:1px solid var(--hairline);border-radius:14px;background:var(--c-bg);color:var(--c-text);box-shadow:0 14px 38px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.28);}
  .security-popover[hidden]{display:none;}
  .security-popover.is-opening{animation:security-in 140ms ease-out;}
  .security-head{display:flex;align-items:flex-start;gap:10px;padding-block-end:8px;border-block-end:1px solid var(--hairline);}
  .security-title{min-width:0;flex:1;}
  .security-title strong{display:block;font-size:15px;line-height:21px;font-weight:600;}
  .security-title span{display:block;margin-block-start:1px;font-size:10px;line-height:15px;color:var(--c-text3);}
  .security-close{flex:0 0 28px;width:28px;height:28px;border-radius:50%;font-size:18px;line-height:28px;text-align:center;color:var(--c-text2);}
  .security-close:hover{background:var(--c-muted);}
  .security-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px;margin-block-start:10px;}
  .security-item{min-width:0;}
  .security-item.wide{grid-column:1/-1;}
  .security-item .lab{display:block;font-size:10px;line-height:14px;color:var(--c-text3);}
  .security-item .val{display:block;margin-block-start:1px;font-size:13px;line-height:19px;font-weight:500;overflow-wrap:anywhere;}
  .security-date{margin-block-start:10px;font-size:9px;line-height:14px;color:var(--c-text3);}
  .security-link{font:inherit;color:inherit;text-align:start;white-space:normal;}
  .security-link:hover{text-decoration:underline;text-underline-offset:3px;}
  @keyframes security-in{from{opacity:0;transform:translateY(7px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}
  @media (max-width:560px){
    .security-popover{left:12px !important;right:12px;bottom:max(12px,env(safe-area-inset-bottom));top:auto !important;width:auto;max-height:70vh;overflow:auto;}
  }
  @media (prefers-reduced-motion:reduce){
    .tile,.mg-cell:not(.mg-head){transform:none !important;transition:none;}
    .security-popover.is-opening{animation:none;}
  }
</style>
<style>
/* 响应式适配: 由 build.py 在构建时注入 <head> 尾部(置于模板样式之后, 覆盖生效)
   断点设计: ≤640px 手机 / 641-760px 窄桌面与平板竖屏 / >760px 桌面(模板原样) */

/* ===== 全宽度通用: 防止 grid 子项内容溢出撑破布局 ===== */
.detail>div,
.mom #mom-body{min-width:0;}

/* ===== 窄桌面/平板竖屏(≤760px): 表格防溢出, 内容过宽时内部横滑 ===== */
@media (max-width:760px){
  .detail>div{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .mom #mom-body{overflow-x:auto;-webkit-overflow-scrolling:touch;}
}

/* ===== 手机(≤640px) ===== */
@media (max-width:640px){
  /* 刘海屏/圆角屏安全区(配合 viewport-fit=cover 生效) */
  .root{
    padding:12px 12px 10px;
    padding-left:max(12px, env(safe-area-inset-left));
    padding-right:max(12px, env(safe-area-inset-right));
  }

  /* 头部: 更紧凑, 按钮加大触控面积 */
  .head{gap:4px;row-gap:6px;}
  .head .t{font-size:15px;}
  .linkbtn{font-size:12px;padding:4px 10px;}

  /* KPI 首屏: 4列 -> 2×2 网格, 避免挤压截断 */
  .kpi{grid-template-columns:1fr 1fr;}
  .kpi .cell{padding-inline:8px;padding-block:2px;}
  .kpi .cell:nth-child(3){border-inline-start:none;padding-inline-start:0;}
  .kpi .cell:nth-child(n+3){border-block-start:1px solid var(--hairline);}
  .kpi .val{font-size:15px;line-height:18px;}
  .kpi .sub{font-size:9px;}

  /* 页签: 加大触控面积 */
  .tab{font-size:13px;padding:7px 12px;}

  /* 资产地图: 等宽网格(每行5格), 免横滑, 各组格子大小一致; 条带高度改自适应(桌面固定像素代表配置权重, 手机端会溢出重叠) */
  .bandbody{flex-wrap:wrap;overflow:visible;gap:2px;height:auto !important;}
  /* grow=0: 单标的(如核心资产)不再拉伸通栏, 与五列网格保持一致宽度 */
  .tile{flex:0 1 calc(20% - 2px);min-width:0;padding:4px 2px;}
  .tile .sb{font-size:8px;}
  .tile .nm{font-size:11px;}
  .tile .pc{font-size:11px;}

<script>
(function(){
"use strict";
var host = window.DaimonWidget;
var fetchedData=null;
function fb(){ try{ return JSON.parse(document.getElementById('fallback-data').textContent); }catch(e){ return {}; } }
function curData(){
  if(fetchedData && fetchedData.b1 && fetchedData.etf) return fetchedData;
  var m = (host && host.data && host.data.main) || null;
  return (m && m.b1 && m.etf) ? m : fb();
}
/* 独立站点: 启动时后台拉取最新 dashboard_data.json, 成功后整体重渲染 */
function loadRemoteData(){
  fetch('dashboard_data.json?_='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('http '+r.status);
    return r.json();
  }).then(function(j){
    if(j && j.b1 && j.etf){
      fetchedData=j;
      render(ensureView());
      var el=$('hd-meta'); if(el) el.title='已加载最新数据';
      /* 新数据到达后补刷一次最新行情，避免首次请求或旧响应覆盖新快照 */
      refreshQuotes(false);
    }
  }).catch(function(){});
}
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function code6(c){ return String(c==null?'':c).slice(0,6); }
function nameCode(nm, code){ return esc(nm)+' <span class="code num">'+code6(code)+'</span>'; }
function securityLink(strategy, nm, code){
  return '<button type="button" class="security-link" data-security="'+esc(strategy)+'" data-code="'+code6(code)+'"'
    +' aria-label="查看'+esc(nm)+'基本信息">'+nameCode(nm,code)+'</button>';
}
function fp(v,d){ if(v==null||isNaN(v)) return '—'; return Number(v).toFixed(d==null?2:d); }
function pct(v){ if(v==null||isNaN(v)) return '—'; return (v>0?'+':'')+fp(v,2)+'%'; }
function cls(v){ return v==null?'flat':(v>0?'up':(v<0?'down':'flat')); }
function pctHtml(v){ return '<span class="'+cls(v)+' num">'+pct(v)+'</span>'; }
function scoreCls(v){ return v==null?'flat':(v>0?'up':(v<0?'down':'flat')); }
var STRATS=['质量微盘','红利成长','核心资产'];
var state={tab:'map', legend:{'质量微盘':true,'红利成长':true,'核心资产':true}, cmsWin:'20'};

/* ---------------- 最新行情刷新(打开/恢复均执行; 15分钟定时限交易时段) ----------------
   数据源: 腾讯行情公开接口(qt.gtimg.cn, 允许跨域); 仅刷新 close/pct_chg, 持仓名单不变 */
var view=null, viewSrc=null, quoteRequestId=0;
function ensureView(){
  var m=curData();
  if(view===null || viewSrc!==m){ view=JSON.parse(JSON.stringify(m)); viewSrc=m; }
  return view;
}
function tencentSymbol(code){ return (String(code).charAt(0)==='6'||String(code).charAt(0)==='9'?'sh':'sz')+String(code); }
function inSession(){
  var n=new Date(), d=n.getDay(), t=n.getHours()*60+n.getMinutes();
  if(d===0||d===6) return false;
  return (t>=565&&t<695)||(t>=775&&t<905); /* 9:25-11:35, 12:55-15:05 */
}
function setQuoteStatus(txt, isErr){
  var el=$('btn-quote'); if(!el) return;
  el.textContent=txt||'刷新行情';
  el.className='linkbtn'+(isErr?' err':'');
}
function refreshQuotes(manual){
  var d=ensureView(), requestId=++quoteRequestId;
  if(!d || !d.b1) return;
  var codes=[], seen={};
  function pick(list){ (list||[]).forEach(function(x){ if(x&&x.code&&!seen[x.code]){ seen[x.code]=1; codes.push(String(x.code)); } }); }
  pick(d.b1.holdings); pick(d.dividend&&d.dividend.holdings);
  pick(d.etf&&d.etf.targets); pick(d.etf&&d.etf.pool);
  if(!codes.length) return;
  if(manual) setQuoteStatus('刷新中…');
  var url='https://qt.gtimg.cn/q=' + codes.map(tencentSymbol).join(',') + '&_=' + Date.now();
  fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('http '+r.status);
    return r.text();
  }).then(function(txt){
    if(requestId!==quoteRequestId || d!==ensureView()) return;
    var map={};
    var re=/v_(?:sh|sz)(\d{6})="([^"]*)"/g, m2;
    while((m2=re.exec(txt))){
      var f=m2[2].split('~');
      var close=Number(f[3]), pct=Number(f[32]);
      if(isFinite(close)&&isFinite(pct)) map[m2[1]]={close:close, pct:pct};
    }
    if(!Object.keys(map).length) throw new Error('empty quote response');
    function upd(list){ (list||[]).forEach(function(x){
      var q=map[String(x.code)];
      if(q){ x.close=q.close; x.pct_chg=q.pct; }
    }); }
    upd(d.b1.holdings); upd(d.dividend&&d.dividend.holdings);
    upd(d.etf&&d.etf.targets); upd(d.etf&&d.etf.pool);
    render(d);
    var n=new Date(), hh=('0'+n.getHours()).slice(-2), mm=('0'+n.getMinutes()).slice(-2);
    setQuoteStatus('已刷新 '+hh+':'+mm);
  }).catch(function(){
    if(requestId===quoteRequestId) setQuoteStatus('刷新失败，保留上次数据', true);
  });
}
setInterval(function(){ if(inSession()) refreshQuotes(false); }, 15*60*1000);
refreshQuotes(false);
window.addEventListener('pageshow', function(e){ if(e.persisted) refreshQuotes(false); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') refreshQuotes(false); });
if($('btn-quote')) $('btn-quote').addEventListener('click', function(){ refreshQuotes(true); });

/* ---------------- 渲染 ---------------- */
function render(d){
  if(!d || !d.b1) return;
  var meta=d.meta||{};
  $('hd-meta').textContent='行情 '+ (meta.quote_date||'—') +' · 选股基准 '+(meta.selection_date||'—') + (meta.generated_at?(' · 更新于 '+meta.generated_at.slice(5,16)):'');
  renderKpi(d);
  renderMap(d);
  renderDetail(d);
  renderChart(d);
  renderMomentum(d);
  renderMicrocap(d);
  closeSecurityInfo();
}

function avgPct(list){
  var s=0,n=0;
  (list||[]).forEach(function(x){ if(x&&isFinite(x.pct_chg)){ s+=x.pct_chg; n++; } });
  return n? s/n : null;
}
function renderKpi(d){
  /* 当前持仓篮子今日收益: 微盘10只/红利5只等权, 核心资产按腿权重(pool兜底涨跌幅) */
  var r1=avgPct(d.b1&&d.b1.holdings);
  var r2=avgPct(d.dividend&&d.dividend.holdings);
  var r3=null;
  var tg=(d.etf&&d.etf.targets)||[];
  if(tg.length){
    var pool={}; ((d.etf&&d.etf.pool)||[]).forEach(function(x){ pool[String(x.code)]=x; });
    var s=0, any=false;
    tg.forEach(function(x){
      var pc=isFinite(x.pct_chg)?x.pct_chg:((pool[x.code]&&isFinite(pool[x.code].pct_chg))?pool[x.code].pct_chg:NaN);
      if(isFinite(pc)){ s+=x.weight*pc; any=true; }
    });
    r3= any? s : null;
  }
  /* 总策略当日收益 = Σ 子策略涨幅 × 持仓占比(4×20%动量轮动仓位, 未配置部分为现金收益0) */
  var alloc=computeAlloc(d.rotation||{});
  var rs={'质量微盘':r1,'红利成长':r2,'核心资产':r3};
  var total=0;
  STRATS.forEach(function(sname){ var r=rs[sname]; if(r!=null) total += r * alloc[sname]; });
  total=Math.round(total*100)/100;
  var cells=[
    {lab:'总策略今日', val:total, sub:'按4×20%动量仓位加权(余20%现金)'},
    {lab:'质量微盘', val:r1, sub:'当前持仓等权'},
    {lab:'红利成长', val:r2, sub:'当前持仓等权'},
    {lab:'核心资产', val:r3, sub:'当前持仓按腿权重'}
  ];
  $('kpi').innerHTML=cells.map(function(c){
    return '<div class="cell">'
      +'<div class="lab">'+esc(c.lab)+'</div>'
      +'<div class="val num '+cls(c.val)+'">'+pct(c.val)+'</div>'
      +'<div class="sub num">'+esc(c.sub)+'</div>'
      +'</div>';
  }).join('');
}
function fmtScore(v){ if(v==null||isNaN(v)) return '—'; if(Math.abs(v)<0.005) return '0.00'; return (v>0?'+':'')+Number(v).toFixed(2); }

function band(label, metaText, hpx, tilesHtml, footHtml){
  return '<div class="band">'
    +'<div class="bandhead"><span class="bn">'+label+'</span><span class="bm">'+metaText+'</span></div>'
    +'<div class="bandbody" style="height:'+hpx+'px">'+tilesHtml+'</div>'
    +(footHtml||'')
    +'</div>';
}
function tileHtml(nm, sb, pc, extra, isNew, strategy, code){
  var tcls = pc==null ? 't-flat' : (pc>0?'t-up':(pc<0?'t-down':'t-flat'));
  if(extra) tcls=extra;
  var tip = nm + (sb?' '+sb:'') + (pc!=null?(' '+(pc>0?'+':'')+pc.toFixed(2)+'%'):'');
  var content=(isNew?'<div class="bdg">新</div>':'')
    +'<div class="nm">'+esc(nm)+'</div>'
    +(sb?'<div class="sb num">'+esc(sb)+'</div>':'')
    +(pc!=null?'<div class="pc num '+cls(pc)+'">'+pct(pc)+'</div>':'');
  if(!strategy||!code) return '<div class="tile '+tcls+'" title="'+esc(tip)+'">'+content+'</div>';
  return '<button type="button" class="tile '+tcls+'" data-security="'+esc(strategy)+'" data-code="'+code6(code)+'"'
    +' title="'+esc(tip)+'" aria-label="'+esc(tip+'，点击查看基本信息')+'">'+content+'</button>';
}
/* 较上日变动行: 新进计数 + 退出名单(超3只折叠) */
function chgFoot(changes){
  if(!changes) return '';
  var n = changes.new ? changes.new.length : 0;
  var outNames = (changes.exited||[]).map(function(x){return x.name;});
  if(!n && !outNames.length) return '';
  var parts = [];
  if(n) parts.push('新进 <b>'+n+'</b>');
  if(outNames.length) parts.push('退出 '+(outNames.length>3 ? outNames.slice(0,3).join('、')+' 等'+outNames.length+'只' : outNames.join('、')));
  return '<div class="bandchg">'+parts.join(' · ')+'</div>';
}

function renderMap(d){
  var wrap=$('map'); if(!wrap) return;
  var H = 264, headH = 16, gap = 6;
  /* 有退出名单的条带预留变动行高度, 避免格子被压缩裁切 */
  var chgB = (d.b1&&d.b1.changes&&(d.b1.changes.exited||[]).length)?1:0;
  var chgD = (d.dividend&&d.dividend.changes&&(d.dividend.changes.exited||[]).length)?1:0;
  var chgC = (d.etf&&d.etf.changes&&(d.etf.changes.exited||[]).length)?1:0;
  var footH = 14, footGap = 2;
  var bodyH = H - (headH+gap)*3 - (chgB+chgD+chgC)*(footH+footGap);
  var hB = Math.round(bodyH*0.44), hD = Math.round(bodyH*0.28), hC = Math.max(bodyH - hB - hD, 48);
  /* 仓位与下方多周期动量区同一套 4×20% 规则 */
  var alloc = computeAlloc(d.rotation||{});

  var b1 = d.b1.holdings||[];
  var b1Tiles = b1.map(function(x){
    return tileHtml(x.name, code6(x.code), x.pct_chg, null, x.is_new, 'micro', x.code);
  }).join('');

  var dv = d.dividend.holdings||[];
  var dvTiles = dv.map(function(x){
    return tileHtml(x.name, code6(x.code), x.pct_chg, null, x.is_new, 'dividend', x.code);
  }).join('');

  var etf = d.etf||{};
  var pool = etf.pool||[];
  /* 双标的同时入选时分别可点击；空仓现金不弹标的信息 */
  var coreTile = (etf.targets||[]).length ? etf.targets.map(function(t){
    var it=pool.filter(function(x){return x.code===t.code;})[0]||{};
    var pc=isFinite(t.pct_chg)?t.pct_chg:(isFinite(it.pct_chg)?it.pct_chg:null);
    return tileHtml(t.name, code6(t.code), pc, null, t.is_new, 'core', t.code);
  }).join('') : tileHtml('持有现金', null, null, null, false);

  var basis = (d.meta && d.meta.basis) || {};
  var bd = function(k){ return basis[k] ? ' · 名单' + basis[k].slice(5).replace('-', '/') : ''; };
  var html = ''
    + band('质量微盘', '仓位 '+Math.round(alloc['质量微盘']*100)+'%'+bd('micro'), hB, b1Tiles, chgFoot(d.b1&&d.b1.changes))
    + band('红利成长', '仓位 '+Math.round(alloc['红利成长']*100)+'%'+bd('dividend'), hD, dvTiles, chgFoot(d.dividend&&d.dividend.changes))
    + band('核心资产', '双轨25/230日 · 仓位 '+Math.round(alloc['核心资产']*100)+'%'+bd('core'), hC, coreTile, chgFoot(etf.changes));

  wrap.innerHTML=html;
  $('map-legend').innerHTML='<span><span class="up">●</span> 上涨</span><span><span class="down">●</span> 下跌</span>'
    +'<span class="lg-full">组内等宽=成分股 · 颜色=今日涨跌 · 仓位=4×20%动量轮动</span>'
    +'<span class="lg-brief">颜色=今日涨跌</span>';
}

function tblRow(cols){
  return '<tr>'+cols.map(function(c,i){
    return '<td'+(i===0?'':' class="num"')+'>'+c+'</td>';
  }).join('')+'</tr>';
}

function renderDetail(d){
  var b1=(d.b1.holdings||[]).slice().sort(function(a,b){return a.total_mv-b.total_mv;});
  var h='<div><h4>质量微盘 · 按总市值升序</h4><table class="dtable"><tr><th>名称</th><th>总市值(亿)</th><th>股东合成分</th><th>涨跌幅</th></tr>';
  b1.forEach(function(x){ h+=tblRow([securityLink('micro',x.name,x.code),fp(x.total_mv,1),(x.holder_comp==null?'—':fp(x.holder_comp,3)),pctHtml(x.pct_chg)]); });
  h+='</table></div><div><h4>红利成长</h4><table class="dtable"><tr><th>名称</th><th>PB</th><th>PE</th><th>股息率</th><th>涨跌幅</th></tr>';
  (d.dividend.holdings||[]).forEach(function(x){ h+=tblRow([securityLink('dividend',x.name,x.code),fp(x.pb,2),fp(x.pe,1),(x.dv_ttm==null?'—':fp(x.dv_ttm,2)+'%'),pctHtml(x.pct_chg)]); });
  h+='</table></div><div><h4>核心资产 · 双轨动量 <span class="rt">'+coreTargetText(d.etf)+'</span></h4>';
  h+=trackTable(d.etf, '短轨')+trackTable(d.etf, '慢轨');
  h+='<div class="signal">'+coreSignalText(d.etf)+'</div></div>';
  $('view-detail').innerHTML='<div class="detail">'+h+'</div>';
}
function coreTargetText(etf){
  etf=etf||{};
  if(etf.cash) return '空仓 · 持有现金';
  return (etf.targets||[]).map(function(t){return t.name+' '+code6(t.code)+' '+Math.round(t.weight*100)+'%';}).join(' + ')||'—';
}
function trackTable(etf, tname){
  etf=etf||{};
  var t=(etf.tracks||{})[tname];
  if(!t) return '';
  var label = tname==='短轨'?'短周期':(tname==='慢轨'?'长周期':tname);
  var rows='';
  var codes=Object.keys(t.detail||{}).sort(function(a,b){
    var sa=t.detail[a].score, sb=t.detail[b].score;
    return (sb==null?-1e9:sb)-(sa==null?-1e9:sa);
  });
  codes.forEach(function(code){
    var dd=t.detail[code];
    var picked=(t.pick===code);
    rows+='<tr'+(picked?' class="pick"':'')+'><td>'+(picked?'● ':'')+securityLink('core',dd.name,code)+'</td>'
      +'<td class="num '+(dd.annualized>0?'up':(dd.annualized<0?'down':'flat'))+'">'+pct(dd.annualized*100)+'</td>'
      +'<td class="num">'+fp(dd.r2,2)+'</td>'
      +'<td class="num '+scoreCls(dd.score)+'">'+fmtScore(dd.score)+'</td>'
      +'<td class="num">'+(dd.pass?'✓':'—')+'</td></tr>';
  });
  return '<div class="trk">'+label
    +(t.live?' · <span class="livemark">盘中末点=实时价</span>':'')
    +(t.pick_name?(' → '+t.pick_name):(t.note?(' → '+esc(t.note)):' → 无满足标的'))+'</div>'
    +'<table class="dtable"><tr><th>名称</th><th>年化</th><th>R²</th><th>得分</th><th>居首</th></tr>'+rows+'</table>';
}
function coreSignalText(etf){
  etf=etf||{};
  var tr=etf.tracks||{};
  var legTxt=function(k){
    var t=tr[k]||{};
    return (t.days||'')+'日 → '+(t.pick_name?'<b>'+esc(t.pick_name)+'</b>':'空仓');
  };
  var s='短轨 '+legTxt('短轨')+'；慢轨 '+legTxt('慢轨');
  if(etf.cash) return s+'。两轨均无满足标（得分≤0 / 年化超上限 / R²不足 / 溢价过高），<b>整体持有现金</b>';
  return s+'。目标仓位：'+(etf.targets||[]).map(function(t){return '<b>'+esc(t.name)+'</b> '+code6(t.code)+' '+Math.round(t.weight*100)+'%';}).join(' + ');
}

/* ---------------- 走势图渲染 ----------------
   三块图共用同一套绘制引擎: 长历史三腿净值 / 长历史多周期动量得分 / 近一年回放净值。
   nav_long 与 cms_long 来自 data/nav_history.json(缺失时整块隐藏, 只保留近一年回放)。 */
var NAV_SERIES=[
  {name:'质量微盘',key:'nav_micro',cls:'s1',dot:'d1'},
  {name:'红利成长',key:'nav_div',cls:'s2',dot:'d2'},
  {name:'核心资产',key:'nav_core',cls:'s3',dot:'d3'}
];
var CMS_LEGS=['质量微盘','红利成长','核心资产'];
var CMS_CLS={'质量微盘':['s1','d1'],'红利成长':['s2','d2'],'核心资产':['s3','d3']};

function legendHtml(series){
  return series.map(function(s){
    return '<button class="lgchip" data-name="'+esc(s.name)+'" aria-pressed="'+(state.legend[s.name]!==false?'true':'false')+'">'
      +'<span class="dot '+s.dot+'"></span>'+esc(s.name)+'</button>';
  }).join('');
}
function bindLegend(box, series, redraw){
  if(!box) return;
  Array.prototype.forEach.call(box.querySelectorAll('.lgchip'),function(btn){
    btn.addEventListener('click',function(){
      var n=btn.getAttribute('data-name');
      state.legend[n]=state.legend[n]===false;
      btn.setAttribute('aria-pressed',state.legend[n]?'true':'false');
      redraw();
    });
  });
}
/* 通用折线图: series=[{name,dates[],values[],cls,dot}], opt={height, yFmt, zeroLine, ticks} */
function drawSeries(series, opt){
  opt=opt||{};
  var box=$(opt.boxId); if(!box) return;
  var W=box.clientWidth||660, H=opt.height||238, PL=38, PR=8, PT=8, PB=16;
  var on=series.filter(function(s){
    return state.legend[s.name]!==false && s.dates && s.values && s.values.length>1;
  });
  if(!on.length){ box.innerHTML='<div class="tr-s" style="padding:8px 0">无可用数据</div>'; return; }
  var all=[];
  on.forEach(function(s){ s.values.forEach(function(v){ if(v!=null&&isFinite(v)) all.push(v); }); });
  if(!all.length){ box.innerHTML='<div class="tr-s" style="padding:8px 0">无可用数据</div>'; return; }
  /* 纵轴变换: 三腿净值从 1.00 涨到 20~30 倍, 线性轴会把前 5 年全压在底部 -> log10;
     动量得分有正有负且跨 6 个数量级(5 日窗口能到百万级) -> symlog(sign×log1p(|v|)), 既保留 0 轴与负值又压缩极值 */
  var logY=!!opt.logY && all.every(function(v){ return v>0; });
  var symY=!!opt.symlog;
  var TV=function(v){ if(logY) return Math.log(v)/Math.LN10; if(symY) return (v<0?-1:1)*Math.log(1+Math.abs(v)); return v; };
  var IV=function(v){ if(logY) return Math.pow(10,v); if(symY) return (v<0?-1:1)*(Math.exp(Math.abs(v))-1); return v; };
  var tv=all.map(TV);
  /* 分位裁剪: 动量得分在净值极短(如5日)时会出现百万级离群值, 直接取 min/max 会把正常区间压成一条线,
     因此按 opt.clip(默认1) 的上下分位数收边, 超界点按边界值绘制(仍可见但不再压垮纵轴) */
  tv.sort(function(a,b){ return a-b; });
  var clip=opt.clip==null?1:opt.clip;
  var lo=tv[Math.floor(tv.length*(1-clip)/2)];
  var hi=tv[Math.min(tv.length-1,Math.ceil(tv.length*(1-(1-clip)/2))-1)];
  var ymin=Math.min(lo,hi), ymax=Math.max(lo,hi);
  if(opt.zeroLine){ ymin=Math.min(ymin,0); ymax=Math.max(ymax,0); }
  var pad=(ymax-ymin)*0.08 || 1;
  ymin-=pad; ymax+=pad;
  if(ymax-ymin<1e-9){ ymin-=1; ymax+=1; }
  var fmtY=opt.yFmt||function(v){ return v.toFixed(1); };
  var fmtAxis=function(v){ return fmtY(IV(v)); };
  var dateKeys={};
  on.forEach(function(s){ s.dates.forEach(function(dt){ if(dt) dateKeys[dt]=1; }); });
  dateKeys=Object.keys(dateKeys).sort();
  var x0=dateKeys[0], x1=dateKeys[dateKeys.length-1];
  function t(ds){ return new Date(ds).getTime(); }
  var span=Math.max(t(x1)-t(x0),1);
  function X(ds){ return PL+(t(ds)-t(x0))/span*(W-PL-PR); }
  function Y(v){ var t=TV(v); return PT+(ymax-t)/(ymax-ymin)*(H-PT-PB); }
  var grid='';
  var N=4;
  for(var i=0;i<=N;i++){
    var gv=ymin+(ymax-ymin)*i/N;
    grid+='<line class="gridl" x1="'+PL+'" y1="'+Y(gv).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(gv).toFixed(1)+'"/>'
      +'<text class="axis" x="'+(PL-4)+'" y="'+(Y(IV(gv))+3).toFixed(1)+'" text-anchor="end">'+fmtAxis(gv)+'</text>';
  }
  if(opt.zeroLine && ymin<0 && ymax>0){
    grid+='<line class="gridl" style="stroke:var(--c-text4);stroke-width:.8" x1="'+PL+'" y1="'+Y(IV(0)).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(IV(0)).toFixed(1)+'"/>';
  }
  var xlab='';
  [[x0,'start'],[dateKeys[Math.floor(dateKeys.length/2)],'middle'],[x1,'end']].forEach(function(tk){
    if(!tk[0]) return;
    xlab+='<text class="axis" x="'+X(tk[0]).toFixed(1)+'" y="'+(H-4)+'" text-anchor="'+tk[1]+'">'+tk[0].slice(0,7)+'</text>';
  });
  var paths='', dots='', clipMarks=[];
  on.forEach(function(s){
    var seg=[], segs=[];
    for(var i=0;i<s.values.length;i++){
      var v=s.values[i];
      if(v==null||!isFinite(v)){ if(seg.length){ segs.push(seg); seg=[]; } continue; }
      var vv=Math.min(IV(ymax),Math.max(IV(ymin),v));
      if(opt.markClip && vv!==v) clipMarks.push('<circle class="clipmark" cx="'+X(s.dates[i]||x0).toFixed(1)+'" cy="'+Y(vv).toFixed(1)+'" r="1.6"/>');
      seg.push(X(s.dates[i]||x0).toFixed(1)+','+Y(vv).toFixed(1));
    }
    if(seg.length) segs.push(seg);
    segs.forEach(function(sg){
      if(sg.length>1) paths+='<polyline class="ln '+s.cls+'" points="'+sg.join(' ')+'"/>';
    });
    for(var j=s.values.length-1;j>=0;j--){
      if(s.values[j]!=null&&isFinite(s.values[j])){
        var dv=Math.min(IV(ymax),Math.max(IV(ymin),s.values[j]));
        dots+='<circle class="'+s.dot+'" cx="'+X(s.dates[j]||x1).toFixed(1)+'" cy="'+Y(dv).toFixed(1)+'" r="2.5"/>';
        break;
      }
    }
  });
  box.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+grid+xlab+paths+clipMarks.join('')+dots+'</svg>';
}

/* 4×20%轮动仓位: 读取后端经warmup与rise确认后的槽位归属 */
var MOM_WS=['5','10','15','20'];
function computeAlloc(rotation){
  var alloc={}, weights=rotation&&rotation.weights||{};
  STRATS.forEach(function(s){ alloc[s]=Number(weights[s]||0); });
  return alloc;
}
function renderMomentum(d){
  var ss=d.strategy_scores||{};
  var WS=MOM_WS;
  var mx=0;
  STRATS.forEach(function(s){ WS.forEach(function(w){ var v=ss[s]&&ss[s][w]; if(v!=null) mx=Math.max(mx,Math.abs(v)); }); });
  if(!mx) mx=1;
  /* 仓位占比: 与资产地图区同一套 4×20% 规则(四槽各20%, 余20%现金) */
  var alloc=computeAlloc(d.rotation||{}), acl={'质量微盘':'a1','红利成长':'a2','核心资产':'a3'};
  var ah='<div class="alloc"><div class="alloc-title">仓位占比（4×20%，余 20% 现金）</div>';
  STRATS.forEach(function(s){
    var segs='', slotCount=Math.round(alloc[s]/0.2);
    for(var i=0;i<4;i++) segs+='<span class="alloc-seg'+(i<slotCount?' on '+acl[s]:'')+'"></span>';
    segs+='<span class="alloc-seg"></span>';  /* 第5格恒为现金 */
    ah+='<div class="alloc-row"><span class="alloc-lab">'+s+'</span>'
      +'<span class="alloc-bar">'+segs+'</span>'
      +'<span class="alloc-pct num">'+Math.round(alloc[s]*100)+'%</span></div>';
  });
  var notes=[];
  WS.forEach(function(w){
    var slot=(d.rotation&&d.rotation.slots||{})[w]||{};
    if(slot.note && notes.indexOf(slot.note)<0) notes.push(slot.note);
  });
  if(notes.length) ah+='<div class="alloc-note">'+esc(notes.join('；'))+'</div>';
  ah+='</div>';
  /* 按列布局: 每列一个周期, 列内色块按得分降序(位置即排名), null 垫底 */
  var h=ah+'<div class="momgrid">';
  WS.forEach(function(w,slotIndex){
    var arr=STRATS.map(function(s){ return {s:s, v:ss[s]?ss[s][w]:null}; })
      .sort(function(a,b){ return (b.v==null?-1e9:b.v)-(a.v==null?-1e9:a.v); });
    var slot=(d.rotation&&d.rotation.slots||{})[w]||{};
    var owner=slot.owner||'—', challenger=slot.challenger||'—';
    var slotText='S'+(slotIndex+1)+' · 持有 '+owner+' · '+(slot.note||'轮动数据缺失');
    h+='<div class="mg-col"><div class="mg-cell mg-head">'+w+'日</div>'
      +'<div class="mg-cell mg-slot" title="'+esc(slotText)+'">'
      +'<span class="mg-owner">S'+(slotIndex+1)+' · '+esc(owner)+'</span>'
      +'<span class="mg-challenger">冠军 · '+esc(challenger)+'</span></div>';
    arr.forEach(function(o,i){
      if(o.v==null){ h+='<div class="mg-cell mg-none">—</div>'; return; }
      var a=Math.min(Math.abs(o.v)/mx,1);
      var pctMix=Math.round(10+a*45);
      var bg = o.v>0 ? 'color-mix(in srgb, var(--up) '+pctMix+'%, var(--c-muted))'
             : o.v<0 ? 'color-mix(in srgb, var(--down) '+pctMix+'%, var(--c-muted))'
             : 'var(--c-muted)';
      h+='<div class="mg-cell num" style="background:'+bg+'">'
        +'<span class="mg-rank">'+(i+1)+'</span>'
        +'<span class="mg-name">'+o.s+'</span>'
        +'<span class="mg-val '+scoreCls(o.v)+'">'+fmtScore(o.v)+'</span></div>';
    });
    h+='</div>';
  });
  $('mom-body').innerHTML=h+'</div>';
}

var securityTrigger=null;

function securityItem(label,value,wide,valueClass){
  return '<div class="security-item'+(wide?' wide':'')+'"><span class="lab">'+esc(label)+'</span>'
    +'<span class="val num '+(valueClass||'')+'">'+infoValue(value)+'</span></div>';

function findSecurity(strategy,code,d){
  code=code6(code);
  if(strategy==='micro') return (d.b1.holdings||[]).filter(function(x){return code6(x.code)===code;})[0];
  if(strategy==='dividend') return (d.dividend.holdings||[]).filter(function(x){return code6(x.code)===code;})[0];
  if(strategy==='core'){
    var pool=(d.etf.pool||[]).filter(function(x){return code6(x.code)===code;})[0]||{};
    var target=(d.etf.targets||[]).filter(function(x){return code6(x.code)===code;})[0]||{};
    var fast=(d.etf.tracks||{})['短轨']||{}, slow=(d.etf.tracks||{})['慢轨']||{};
    var momentum=Object.assign({}, (fast.detail||{})[code], (slow.detail||{})[code]);
    return Object.assign({},pool,target,momentum);
  }
}

  rows+=securityItem('最新收盘',hasValue(item.close)?fp(item.close,2):null);
  rows+=securityItem('今日涨跌',hasValue(item.pct_chg)?pct(item.pct_chg):null,false,cls(item.pct_chg));
  if(strategy!=='core') rows+=securityItem('最新财报期',hasValue(item.report_period)?item.report_period:null);
  if(strategy==='micro'){
    rows+=securityItem('总市值',hasValue(item.total_mv)?fp(item.total_mv,1)+' 亿元':null);
  }else if(strategy==='dividend'){
    rows+=securityItem('PB',hasValue(item.pb)?fp(item.pb,2):null);
    rows+=securityItem('PE',hasValue(item.pe)?fp(item.pe,1):null);
    rows+=securityItem('股息率',hasValue(item.dv_ttm)?fp(item.dv_ttm,2)+'%':null);
  }else if(strategy==='core'){
    rows+=securityItem('年化',hasValue(item.annualized)?pct(item.annualized*100):null,false,cls(item.annualized));
    rows+=securityItem('得分',hasValue(item.score)?fmtScore(item.score):null,false,scoreCls(item.score));
    rows+=securityItem('ETF/LOF溢价率',hasValue(item.premium_pct)?pct(item.premium_pct):null,false,cls(item.premium_pct));
  }
  securityTrigger=trigger;
  $('security-name').textContent=item.name||code;
  $('security-subtitle').textContent=code+' · '+names[strategy];
  $('security-grid').innerHTML=rows;
  $('security-date').textContent='行情日期 '+(d.meta&&d.meta.quote_date||'缺失')+' · 数据随每日看板更新';
  var pop=$('security-popover');
  pop.hidden=false;
  pop.classList.remove('is-opening');
  void pop.offsetWidth;
  pop.classList.add('is-opening');
  positionSecurityInfo();
  $('security-close').focus({preventScroll:true});
}
function positionSecurityInfo(){
  var pop=$('security-popover');
  if(!pop||pop.hidden||window.innerWidth<=560||!securityTrigger||!document.contains(securityTrigger)) return;
  var rect=securityTrigger.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
  var left=Math.max(12,Math.min(rect.left,window.innerWidth-pw-12));
  var top=rect.bottom+8;
  if(top+ph>window.innerHeight-12) top=Math.max(12,rect.top-ph-8);
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
function closeSecurityInfo(restoreFocus){
  var pop=$('security-popover');
  if(!pop||pop.hidden) return;
  pop.hidden=true;
  if(restoreFocus&&securityTrigger&&document.contains(securityTrigger)) securityTrigger.focus({preventScroll:true});
  securityTrigger=null;
}
function resetTilt(card){
  if(!card) return;
  card.style.setProperty('--rx','0deg'); card.style.setProperty('--ry','0deg');
  card.classList.remove('is-tilting');
}
function bind(){
  var tiltCard=null, finePointer=window.matchMedia('(hover:hover) and (pointer:fine)');
  var reduceMotion=window.matchMedia('(prefers-reduced-motion:reduce)');
  document.addEventListener('pointermove',function(e){
    if(!finePointer.matches||reduceMotion.matches) return;
    var card=e.target.closest&&e.target.closest('.tile,.mg-cell:not(.mg-head)');
    if(tiltCard&&tiltCard!==card) resetTilt(tiltCard);
    tiltCard=card;
    if(!card) return;
    var r=card.getBoundingClientRect();
    var x=Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width)));
    var y=Math.max(0,Math.min(1,(e.clientY-r.top)/Math.max(1,r.height)));
    card.style.setProperty('--rx',((0.5-y)*2.4).toFixed(2)+'deg');
    card.style.setProperty('--ry',((x-0.5)*2.4).toFixed(2)+'deg');
    card.classList.add('is-tilting');
  },{passive:true});
  document.addEventListener('pointerout',function(e){
    if(tiltCard&&(!e.relatedTarget||!tiltCard.contains(e.relatedTarget))){ resetTilt(tiltCard); tiltCard=null; }
  },{passive:true});
  document.addEventListener('click',function(e){
    var trigger=e.target.closest&&e.target.closest('[data-security]');
    if(trigger){ openSecurityInfo(trigger); return; }
    if(!e.target.closest||!e.target.closest('#security-popover')) closeSecurityInfo(false);
  });
  $('security-close').addEventListener('click',function(){ closeSecurityInfo(true); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSecurityInfo(true); });
  window.addEventListener('resize',function(){ positionSecurityInfo(); resetTilt(tiltCard); tiltCard=null; });

  var tabs=$('tabs'); if(!tabs) return;
  tabs.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.tab'); if(!b) return;
    state.tab=b.getAttribute('data-tab');
    Array.prototype.forEach.call(tabs.querySelectorAll('.tab'),function(t){
      t.setAttribute('aria-selected',t===b?'true':'false');
    });
    $('view-map').style.display=state.tab==='map'?'':'none';
    $('view-detail').style.display=state.tab==='detail'?'':'none';
    $('view-trend').style.display=state.tab==='trend'?'':'none';
    $('view-microcap').style.display=state.tab==='microcap'?'':'none';
    if(state.tab==='trend'){ renderChart(ensureView()); }
    if(state.tab==='microcap'){ renderMicrocap(ensureView()); }
  });
}

try{
  /* 主题: localStorage 记忆 > 手动切换 > 跟随系统 */
  (function(){
    var saved=null;
    try{ saved=localStorage.getItem('dash-theme'); }catch(e){}
    if(saved==='light'||saved==='dark') document.documentElement.setAttribute('data-theme',saved);
    var btn=$('btn-theme');
    if(btn) btn.addEventListener('click',function(){
      var cur=document.documentElement.getAttribute('data-theme');
      var dark = cur ? (cur==='dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var next=dark?'light':'dark';
      document.documentElement.setAttribute('data-theme',next);
      try{ localStorage.setItem('dash-theme',next); }catch(e){}
    });
  })();
  bind();
  render(ensureView());
  loadRemoteData();
  loadNavLong();
  if(host && typeof host.onDataChange==='function'){
    host.onDataChange(function(){ render(ensureView()); });
  }
  if(host && typeof host.onThemeChange==='function'){ host.onThemeChange(function(){ render(ensureView()); }); }
  window.addEventListener('resize',function(){ var d=ensureView(); if(state.tab==='trend')renderChart(d); if(state.tab==='microcap')renderMicrocap(d); });
}catch(e){ /* 渲染异常时保持静态内容 */ }
})();
</script>
</body>
</html>
